<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Cartelera diaria del cine barato y alternativo de Madrid: Cineteca, Doré, Reina Sofía, Berlanga, Círculo, centros culturales y más.">
<meta name="theme-color" content="#ffffff">
<title>Siete Estrellas</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%23ffff00%27/%3E%3Cpath d=%27M32 10l6.6 14.2 15.4 1.6-11.6 10.4 3.4 15.2L32 43.6l-13.8 7.8 3.4-15.2L10 25.8l15.4-1.6z%27 fill=%27%23000%27/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-title" content="Siete Estrellas">
<style>
/* Layout: muro de carteles a sangre + lista de títulos enormes; barra fija abajo con selector en píldora y círculo a mano en la opción activa */
:root{
  --bg:#ffffff; --ink:#000000; --gray:#bdbdbd; --soft:#f2f2f2; --line:#000000; --accent:#000000; --yellow:#ffff00;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:var(--sans);
  --bar:64px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.25 var(--sans);-webkit-font-smoothing:antialiased;padding-top:var(--bar);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--yellow)}
img{max-width:100%;display:block}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#stage>.day:first-child,#stage>.cal:first-child,#stage>.empty:first-child{border-top:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Línea superior */
.top{padding-block:14px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font:13px/1.3 var(--serif);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.top b{font:400 13px var(--serif)}
.top .arr{font-family:var(--sans);font-size:11px}

/* Día */
.day{border-top:1px solid var(--line)}
.dayh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.dayh h2{margin:0;font:400 clamp(34px,7vw,64px)/.95 var(--sans);letter-spacing:-.045em}
.dayh small{font:13px var(--serif);white-space:nowrap}

/* Muro de carteles */
.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
@media (min-width:600px){.wall{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1000px){body[data-layout="carteles"] .wall{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tile{position:relative;display:block;aspect-ratio:2/3;overflow:hidden;background:var(--soft);min-width:0;width:100%;text-align:left}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .hr{position:absolute;left:6px;bottom:6px;background:var(--bg);color:var(--ink);font:12px/1 var(--sans);padding:4px 6px;border-radius:999px;letter-spacing:-.01em}
.tile.sold img,.tile.sold .fake{filter:grayscale(1);opacity:.45}
.tile.sold .hr{text-decoration:line-through}
.tile .card{position:absolute;inset:0;background:var(--bg);color:var(--ink);padding:10px 10px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;visibility:hidden;overflow:hidden}
.card .k{display:block;font:9px/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.card .v{display:block;font:400 clamp(13px,1.35vw,19px)/1.08 var(--sans);letter-spacing:-.025em;overflow-wrap:anywhere}
.card .v.t{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
@media (hover:hover){.tile:hover .card,.tile.hl .card,.tile:focus-visible .card{visibility:visible}
  .wall:hover .tile.hl:not(:hover) .card{visibility:hidden}}
@media (hover:none){.tile .card{display:none}}

/* Portada generada */
.tile .fake{padding-bottom:36px}
.fake{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:9px;color:#fff;overflow:hidden}
.fk-kind{font:10px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(255,255,255,.8);padding:3px 6px;border-radius:999px}
.fk-ico{width:38%;height:auto;align-self:center;fill:none;stroke:rgba(255,255,255,.85);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.fk-title{font:400 clamp(13px,3.4vw,18px)/1.02 var(--sans);letter-spacing:-.03em;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;width:100%}

/* Lista */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:end;column-gap:12px;width:100%;text-align:left;cursor:pointer;padding:7px max(16px,env(safe-area-inset-right,0px)) 7px max(16px,env(safe-area-inset-left,0px))}
.row .meta{grid-column:1 / -1;font:13px/1.3 var(--serif);display:flex;flex-wrap:wrap;gap:0 7px;align-items:baseline}
.row .meta .arr{font:11px var(--sans)}
.row .ttl{font:400 clamp(28px,6.2vw,46px)/1 var(--sans);letter-spacing:-.045em;overflow-wrap:anywhere;min-width:0}
.row .hh{font:400 clamp(28px,6.2vw,46px)/1 var(--sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.sold,.row.sold .meta{color:var(--gray)}
.row.sold .hh{text-decoration:line-through}
@media (hover:hover){
  .list:hover .row,.list.dim .row,.list:hover .row .meta,.list.dim .row .meta{color:var(--gray)}
  .list .row:hover,.list.dim .row.on,.list .row:hover .meta,.list.dim .row.on .meta{color:var(--ink)}
  .list .row:hover .ttl,.list.dim .row.on .ttl,.list .row:hover .hh,.list.dim .row.on .hh{font-weight:700;letter-spacing:-.05em}
}
@media (min-width:900px){
  .row{grid-template-columns:minmax(0,max-content) minmax(10em,1fr) auto auto;align-items:start}
  .row .ttl{grid-column:1;grid-row:1}
  .row .meta{grid-column:2;grid-row:1;padding-top:.45em;font-size:12px}
  .row .heart{grid-column:3;grid-row:1;align-self:center}
  .row .hh{grid-column:4;grid-row:1}
}

.row .thumb,.row .mp{display:none}
@media (max-width:640px){
  .row{grid-template-columns:76px auto minmax(0,1fr) auto;grid-template-areas:"th meta meta heart" "th ttl ttl ttl" "th hh mp mp";grid-template-rows:auto auto 1fr;column-gap:14px;row-gap:3px;align-items:start;padding-top:12px;padding-bottom:12px;border-bottom:1px solid #e6e6e6}
  .row .thumb{display:block;grid-area:th;width:76px;aspect-ratio:2/3;overflow:hidden;background:var(--soft)}
  .row .thumb img{width:100%;height:100%;object-fit:cover}
  .row .thumb .fake{padding:6px}
  .row .thumb .fk-kind{font-size:7px;padding:2px 4px}
  .row .thumb .fk-title{font-size:10px;-webkit-line-clamp:4}
  .row .meta{grid-area:meta;font:12px/1.25 var(--serif);padding-top:2px}
  .row .meta>span:nth-child(n+2){display:none}
  .row .ttl{grid-area:ttl;font-size:22px;line-height:1.05;letter-spacing:-.035em}
  .row .hh{grid-area:hh;font:700 20px/1 var(--sans);letter-spacing:-.02em;margin-top:6px;align-self:end}
  .row .mp{display:block;grid-area:mp;align-self:end;margin-bottom:1px;font:13px var(--serif);color:var(--ink);padding-left:4px}
  .row .heart{grid-area:heart;align-self:start;margin:-8px -8px 0 0}
  .row.sold .thumb{filter:grayscale(1);opacity:.5}
  .dayh{padding-top:14px;padding-bottom:6px}
  .dayh h2{font-size:34px}
  .list{border-top:1px solid #e6e6e6}
}

.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 12px;padding:6px max(14px,env(safe-area-inset-right,0px)) 26px max(14px,env(safe-area-inset-left,0px))}
.mcard{min-width:0;display:flex;flex-direction:column}
.mposter{display:block;width:100%;aspect-ratio:2/3;overflow:hidden;background:var(--soft)}
.mposter img{width:100%;height:100%;object-fit:cover}
.mposter .fake{padding:10px;justify-content:flex-start;gap:28%}
.mposter .fk-title{display:none}
.mposter .fk-ico{width:30%}
.mtitle{margin:9px 0 0;font:400 21px/1.02 var(--sans);letter-spacing:-.04em;overflow-wrap:anywhere;text-wrap:balance}
.msess{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.msess li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-top:1px solid #ececec}
.msess li.x{display:none}
.mcard.open .msess li.x{display:grid}
.mses{display:flex;gap:7px;align-items:baseline;min-width:0;text-align:left;padding:7px 0;min-height:36px}
.mses .h{font:700 15px/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mses .c{font:12px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mses.sold{color:var(--gray)}
.mses.sold .h{text-decoration:line-through}
.msess .heart{font-size:13px;padding:10px 4px 10px 8px;margin:0}
.mmore{align-self:flex-start;margin-top:4px;font:12px var(--serif);text-decoration:underline;text-underline-offset:2px;padding:6px 0}
.mcard.sold .mposter{filter:grayscale(1);opacity:.5}

.extra{border-top:1px solid #e6e6e6;padding:16px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px))}
.exh{margin:0;font:700 13px var(--sans);text-transform:uppercase;letter-spacing:.04em}
.exn{margin:4px 0 10px;font:13px/1.35 var(--sans);color:#666;max-width:60ch}
.exl{list-style:none;margin:0;padding:0}
.exl li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-top:1px solid #efefef}
.exr{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;align-items:baseline;text-align:left;padding:10px 0;min-width:0}
.exr .h{font:700 16px var(--sans);font-variant-numeric:tabular-nums}
.exr .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.exr .t{font:400 18px/1.15 var(--sans);letter-spacing:-.02em}
.exr .c{font:12px/1.3 var(--sans);color:#666}
@media (min-width:900px){.exr .t{font-size:22px}.exl{columns:2;column-gap:40px}.exl li{break-inside:avoid}}

.row.grow{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,46%);align-items:center;column-gap:28px;padding-top:4px;padding-bottom:4px;border-top:1px solid #ededed;cursor:default}
.gttl{font:400 clamp(24px,2.6vw,34px)/1.05 var(--sans);letter-spacing:-.04em;text-align:left;overflow-wrap:anywhere}
.gfirst{display:grid;grid-template-columns:46px auto minmax(0,1fr) auto auto;align-items:center;gap:10px;min-width:0;cursor:pointer;padding:2px 0}
.gfirst .h{font:700 15px var(--sans);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.gfirst .c{font:13px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gfirst .p{font:12px var(--sans);color:#666;white-space:nowrap}
@media (hover:hover){.gfirst:hover .c{text-decoration:underline}}
.gs{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:baseline;text-align:left;padding:2px 0;min-width:0}
.gs .h{font:700 15px var(--sans);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.gs .c{font:13px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs .p{font:12px var(--sans);color:#666;white-space:nowrap}
.gs.sold{color:var(--gray)}.gs.sold .h{text-decoration:line-through}
.gcount{font:700 11px var(--sans);white-space:nowrap;border:1px solid currentColor;border-radius:999px;padding:2px 8px;text-align:center}
.gcount.none{border:0;padding:0}
.row .gfirst .heart,.row .gses .heart{font-size:12px;padding:4px 6px;grid-column:auto;grid-row:auto;margin:0}
.gses{display:none;list-style:none;margin:0;padding:0 0 2px;grid-column:2}
.grow.open .gses{display:block}
.gses li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
@media (hover:hover){.list .row.grow:hover .gttl,.list.dim .row.grow.on .gttl{font-weight:700;letter-spacing:-.05em}.gs:hover .c{text-decoration:underline}}
.cols .row.grow{grid-template-columns:1fr;row-gap:2px;padding-top:6px;padding-bottom:6px}
.cols .gses{grid-column:1}
@media (max-width:640px){.row.grow{grid-template-columns:1fr}.gses{grid-column:1}}

/* Columnas (solo escritorio) */
.cols{display:grid;grid-template-columns:1fr 1fr}
.cols .wall{grid-template-columns:repeat(5,minmax(0,1fr));align-content:start}
.cols .list{border-left:1px solid var(--line)}
.cols .row .ttl,.cols .row .hh{font-size:clamp(26px,3.1vw,44px)}

/* Favoritos */
.tile .fav{position:absolute;right:6px;top:6px;background:var(--bg);color:var(--ink);font-size:14px;padding:5px;border-radius:999px;line-height:0}
.hsvg{display:block;width:1em;height:1em;overflow:visible}
.hsvg path{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.heart{font-size:17px;line-height:1;padding:10px;margin:-10px -4px -10px 0;color:var(--gray);border-radius:999px;align-self:center}
.heart .hsvg path{stroke-width:1.25}
@media (hover:hover){.list .row:hover .heart,.list.dim .row.on .heart{color:var(--ink)}}
@media (min-width:900px){.heart{font-size:15px}}
.heart[aria-pressed="true"]{color:var(--ink)!important}
.heart[aria-pressed="true"] .hsvg path,.fav .hsvg path,.favbtn[aria-pressed="true"] .hsvg path{fill:currentColor}
@media (hover:hover){.heart{transition:transform .12s,color .12s}.heart:hover{transform:scale(1.15);color:var(--ink)}}
@media (prefers-reduced-motion:no-preference){.heart[aria-pressed="true"] .hsvg{animation:pop .25s ease-out}}
@keyframes pop{50%{transform:scale(1.25)}}
.favbtn .hsvg{width:16px;height:16px}
.favbtn{display:inline-flex;align-items:center;gap:8px;margin:18px 10px 0 0;border:1px solid var(--line);border-radius:999px;padding:12px 20px;font:13px var(--sans);text-transform:uppercase;letter-spacing:.03em;background:var(--bg);color:var(--ink)}
.favbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sin{font:15px/1.45 var(--serif);margin:14px 0 0;max-width:62ch}

/* Calendario */
.cal{border-top:1px solid var(--line)}
.calh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.calh h2{margin:0;font:400 clamp(34px,7vw,64px)/.95 var(--sans);letter-spacing:-.045em;text-transform:capitalize}
.calnav{display:flex;gap:6px}
.calnav button{border:1px solid var(--line);border-radius:999px;width:40px;height:34px;font:16px var(--sans)}
.calnav button:disabled{opacity:.25;cursor:default}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.cwd{font:12px var(--serif);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.cday{position:relative;min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.cday:nth-child(7n){border-right:0}
.cday .num{position:relative;font:400 18px/1 var(--sans);letter-spacing:-.03em;align-self:flex-start;padding:2px 3px}
.cday.past .num,.cday.out .num{color:var(--gray)}
.cday .thumbs{display:flex;gap:2px;flex-wrap:wrap}
.cday .thumbs>*{width:calc(50% - 1px);aspect-ratio:2/3;overflow:hidden;background:var(--soft)}
.cday .thumbs img{width:100%;height:100%;object-fit:cover}
.cday .thumbs .fake{padding:3px}
.cday .thumbs .fake .fk-kind,.cday .thumbs .fake .fk-ico{display:none}
.cday .thumbs .fake .fk-title{font-size:8px;-webkit-line-clamp:4}
.cday .more{font:11px var(--serif)}
.cday.has{cursor:pointer}
.cday .scrib{left:-40%;top:-45%;width:180%;height:190%}
@media (min-width:900px){.cday{min-height:150px}.cday .thumbs>*{width:calc(33.3% - 2px)}}
.calempty{padding:20px max(16px,env(safe-area-inset-left,0px));font:15px/1.4 var(--serif)}

/* Cartel flotante que sigue al ratón en la lista */
#peek{position:fixed;left:0;top:0;width:clamp(200px,19vw,300px);aspect-ratio:2/3;pointer-events:none;z-index:25;opacity:0;transition:opacity .12s;will-change:transform;background:var(--soft)}
#peek.on{opacity:1}
#peek img{width:100%;height:100%;object-fit:cover}
#peek .fake{padding-bottom:9px}
@media (hover:none){#peek{display:none}}

/* Selector de fecha */
.datesel{position:relative;display:flex;justify-content:center}
#dateBtn{font:900 20px/1 var(--sans);letter-spacing:.005em;text-transform:uppercase;-webkit-text-stroke:.35px currentColor;padding:9px 6px;min-height:44px;white-space:nowrap}
#dateBtn .caret{font-weight:400;-webkit-text-stroke:0;font-size:.8em}
.datepop{position:fixed;top:calc(env(safe-area-inset-top,0px) + var(--bar));left:0;right:0;z-index:45;background:var(--bg);border-bottom:1px solid var(--line);max-height:calc(100vh - var(--bar) - env(safe-area-inset-top,0px));overflow:auto;box-shadow:0 18px 40px rgba(0,0,0,.12)}
.dp-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.dp-top h2{margin:0;font:400 clamp(34px,6vw,64px)/.95 var(--sans);letter-spacing:-.045em;text-transform:capitalize}
.dp-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.dp-q{font:400 20px/1 var(--sans);text-transform:uppercase;letter-spacing:-.02em;padding:10px 2px;min-height:44px}
.dp-q[aria-pressed="true"]{font-weight:900;-webkit-text-stroke:.35px currentColor;letter-spacing:.005em}
.dp-tools select{font:18px var(--sans);border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:var(--bg);color:var(--ink)}
.calnav button:disabled{opacity:.25}
.cgrid.pick .cday{min-height:64px;cursor:pointer}
@media (min-width:900px){.cgrid.pick .cday{min-height:96px}}
.cgrid.pick .cday:disabled{cursor:default}
.cgrid.pick .cday:disabled .num{color:var(--gray)}
.cday .cnt{margin-top:auto;font:12px/1.2 var(--serif);color:var(--ink)}
.cday.sel{background:var(--yellow)}
@media (hover:hover){.cgrid.pick .cday:not(:disabled):not(.sel):hover,.cday.has:not(.sel):hover{background:#ffffa6}}
@media (max-width:599px){.cday .cnt{font-size:13px}.cday .cnt .w{display:none}}

/* Barra inferior */
.bar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:30;background:var(--yellow);border-bottom:1px solid var(--line);height:var(--bar);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.mark{font:400 20px var(--sans);letter-spacing:-.03em;white-space:nowrap}
@media (max-width:899px){.mark{font-size:18px}}
@media (max-width:379px){.mark,.barR button,.pill button{font-size:16px!important}.pill{gap:2px}.pill button{padding-left:4px!important;padding-right:4px!important}}
.barR{display:flex;gap:16px;align-items:baseline;justify-self:end}
.barR button{font:400 20px var(--sans);letter-spacing:-.03em;white-space:nowrap}
.barR .n{font:11px var(--sans);vertical-align:super;margin-left:2px}
.mid{display:flex;justify-content:center;gap:clamp(24px,5vw,72px);min-width:0}

/* Píldora */
.pill{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:999px;background:transparent}
.pill button{position:relative;font:400 20px/1 var(--sans);letter-spacing:-.02em;text-transform:uppercase;padding:9px 14px;white-space:nowrap}
.pill button+button{border-left:0}
.pill{border:0!important;border-radius:0;gap:clamp(4px,1.6vw,22px);grid-auto-columns:auto}
.pill button{padding-left:6px!important;padding-right:6px!important}
.pill button{font-weight:400;color:var(--ink)}
.pill button[aria-pressed="true"]{font-weight:900;letter-spacing:.01em;-webkit-text-stroke:.35px currentColor}
@media (hover:hover){.pill button:not([aria-pressed="true"]):hover{font-weight:600}}
.cday .num.today{font-weight:900;-webkit-text-stroke:.4px currentColor;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.scrib{position:absolute;left:-14%;top:-38%;width:128%;height:176%;pointer-events:none;overflow:visible}
.scrib path{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion:no-preference){.scrib path{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .45s ease-out forwards}}
@keyframes draw{to{stroke-dashoffset:0}}
#viewPill{grid-area:view;justify-self:center}

#viewPill .n{font-size:9px;line-height:0;vertical-align:super;margin-left:2px}

@media (max-width:899px){#dateBtn{font-size:18px}}
@media (max-width:379px){#dateBtn{font-size:16px}}

#l-guardadas .ico{display:none}

}
@media (max-width:899px){
  :root{--bar:56px}
  .bar{grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"mark period view filt";column-gap:6px}
  .mid{display:contents}
  .mark{grid-area:mark}
  #periodPill{grid-area:period;justify-self:center;min-width:0;max-width:100%}
  #dateBtn{font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  body[data-layout="guardadas"] #periodPill{visibility:hidden}
  #viewPill{grid-area:view}
  #l-lista{display:none}
  #l-guardadas .lbl{display:none}
  #l-guardadas .ico{display:inline-flex}
  #l-guardadas{font-size:22px!important;padding:0 8px!important;min-height:44px;display:inline-flex;align-items:center;gap:2px}

  .barR{grid-area:filt}

}

<body data-layout="lista">

<h1 class="sr-only">Siete Estrellas</h1>
<main id="stage" aria-live="polite"></main>

<nav class="bar" aria-label="Controles">
  <button class="mark" id="markBtn">Info</button>
  <div class="mid">
    <div class="datesel" id="periodPill">
      <button id="dateBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="datePop"><span id="dateLbl">Hoy</span> <span class="caret" aria-hidden="true">▾</span></button>
    </div>
    <div class="pill" id="viewPill" role="group" aria-label="Vista">
      <button data-l="lista" id="l-lista">Lista</button><button data-l="columnas" id="l-columnas" class="only-wide">Columnas</button><button data-l="guardadas" id="l-guardadas" aria-label="Guardadas"><span class="lbl">Guardadas</span><span class="ico" aria-hidden="true"></span><span class="n" id="favN"></span></button>
    </div>
  </div>
  <div class="barR">
    <button id="filtBtn">Filtros<span class="n" id="filtN"></span></button>
  </div>
</nav>

<div id="peek" aria-hidden="true"></div>
<div class="datepop" id="datePop" role="dialog" aria-label="Elegir fecha y hora" hidden></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT"></div></div>

<script>
const $ = s => document.querySelector(s);
const state = { date:null, from:'', pickMonth:null, calMonth:null, sin:{}, view:'hoy', layout:'columnas', cines:new Set(), precio:'', ocultar:false, q:'', rows:[], meta:null, loaded:false, failed:false };
try { const s = JSON.parse(localStorage.getItem('cdb-prefs') || '{}'); if (s.precio != null) state.precio = s.precio; state.ocultar = !!s.ocultar; state.solo = !!s.solo; (s.cines||[]).forEach(c=>state.cines.add(c)); if (s.layout && s.layout !== 'carteles') state.layout = s.layout; } catch(e){}
function savePrefs(){ try{ localStorage.setItem('cdb-prefs', JSON.stringify({solo:!!state.solo, precio:state.precio, ocultar:state.ocultar, cines:[...state.cines], layout:state.layout})); }catch(e){} }

const pad = n => String(n).padStart(2,'0');

/* Favoritos: se guardan solo en este dispositivo y se borran solos al día siguiente de la proyección */
const FAV_KEY = 'cdb-favs';
let favs = {};
function saveFavs(){ try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(e){} }
function purgeFavs(){
  const t = iso(new Date()); let ch = false;
  for (const [k,v] of Object.entries(favs)) if (!v || !v.fecha || v.fecha < t) { delete favs[k]; ch = true; }
  if (ch) saveFavs();
}
function loadFavs(){ try { favs = JSON.parse(localStorage.getItem(FAV_KEY) || '{}') || {}; } catch(e){ favs = {}; } purgeFavs(); }
const isFav = id => !!favs[id];
function snapshot(r){
  const keep = ['id','titulo','cine','sala','fecha','hora','cartel','enlace','ficha','precio','precioTexto','estado','director','anio','duracion','version','ciclo','municipal'];
  const o = {}; for (const k of keep) if (r[k] != null) o[k] = r[k];
  const sn = synopsis(r); if (sn) o.sinopsis = sn;
  return o;
}
function toggleFav(r){ if (favs[r.id]) delete favs[r.id]; else favs[r.id] = snapshot(r); saveFavs(); }
function synopsis(r){ return r.sinopsis || (r.sk && state.sin[r.sk]) || ''; }
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function rangeFor(view){
  if (view === 'dia' && state.date) return [state.date, state.date];
  const a = new Date(); a.setHours(0,0,0,0);
  const b = new Date(a); b.setDate(b.getDate() + (view==='hoy'?0:view==='semana'?6:30));
  return [iso(a), iso(b)];
}
function dayLabel(f){
  const [y,m,d] = f.split('-').map(Number); const dt = new Date(y,m-1,d);
  const today = iso(new Date()); const tm = new Date(); tm.setDate(tm.getDate()+1);
  const rel = f===today ? 'Hoy' : f===iso(tm) ? 'Mañana' : DIAS[dt.getDay()][0].toUpperCase()+DIAS[dt.getDay()].slice(1);
  return [rel, `${d} ${MESES[m-1]}`];
}
const MUNI = 'Conde Duque y centros municipales';
const ESTADO = { disponible:'Hay entradas', pocas:'Últimas entradas', agotado:'Agotado', gratis:'Gratis', desconocido:'' };
function hue(s){ let h=0; for (const c of s) h=(h*31+c.charCodeAt(0))%360; return h; }
function money(r){
  const num = typeof r.precio === 'number' ? r.precio.toFixed(2).replace('.',',').replace(',00','') + ' €' : null;
  if (r.precio === 0) return 'Gratis';
  const t = (r.precioTexto || '').replace(/\s*euros?/gi,' €').replace(/\s+/g,' ').trim();
  if (t && t.length <= 16) return t;
  if (num) return (/\ba\b|desde|\|/i.test(t) ? 'Desde ' : '') + num;
  return t ? t.slice(0,16) + '…' : '';
}
function ago(isoStr){
  const m = Math.round((Date.now() - new Date(isoStr).getTime())/60000);
  if (m < 1) return 'ahora mismo'; if (m < 60) return `hace ${m} min`;
  const h = Math.round(m/60); if (h < 48) return `hace ${h} h`; return `hace ${Math.round(h/24)} días`;
}
function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) { if (v==null) continue; if (k==='class') e.className=v; else if (k==='text') e.textContent=v; else e.setAttribute(k,v); }
  kids.flat().forEach(k => k!=null && e.append(k)); return e;
}

function filtered(){
  const [a,b] = rangeFor(state.view);
  const now = new Date(); const today = iso(now); const hhmm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const q = state.q.trim().toLowerCase();
  return state.rows.filter(r => {
    if (!r.fecha || r.fecha < a || r.fecha > b) return false;
    if (r.fecha === today && r.hora && r.hora < hhmm) return false;
    if (state.from && r.hora && r.hora < state.from) return false;
    if (state.cines.size && !state.cines.has(r.municipal ? MUNI : r.cine)) return false;
    if (state.ocultar && r.estado === 'agotado') return false;
    if (state.solo && r.generico) return false;
    if (state.precio !== '') { const p = typeof r.precio==='number' ? r.precio : null; if (p == null || p > Number(state.precio)) return false; }
    if (q && !([r.titulo,r.director,r.ciclo,r.cine,r.sala].filter(Boolean).join(' ').toLowerCase().includes(q))) return false;
    return true;
  }).sort((x,y) => (x.fecha+(x.hora||'99')).localeCompare(y.fecha+(y.hora||'99')) || x.cine.localeCompare(y.cine));
}

/* Portadas generadas para lo que no tiene cartel */
const KINDS = [
  [/cine\s*-?\s*club|cineclub/i, 'Cineclub', 'reel'],
  [/cinef[oó]rum|coloquio|debate/i, 'Cinefórum', 'talk'],
  [/infantil|peques|familiar|mi primer festival|matinal/i, 'Infantil', 'star'],
  [/corto|cortometraje/i, 'Cortos', 'clap'],
  [/documental/i, 'Documental', 'eye'],
  [/concierto|m[uú]sica/i, 'Cine y música', 'note'],
  [/ciclo|muestra|festival|semana/i, 'Ciclo', 'grid'],
  [/biblioteca|quedada|filmoteca/i, 'En la biblioteca', 'book'],
];
const ICONS = {
  reel:'<circle cx="24" cy="24" r="18"/><circle cx="24" cy="14" r="4"/><circle cx="24" cy="34" r="4"/><circle cx="14" cy="24" r="4"/><circle cx="34" cy="24" r="4"/>',
  talk:'<path d="M8 12h24v16H18l-8 6v-6H8z"/><path d="M36 18h4v14h-2v5l-6-5H22"/>',
  star:'<path d="M24 6l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z"/>',
  clap:'<rect x="8" y="18" width="32" height="22" rx="2"/><path d="M8 18l4-10 28 4-2 6"/><path d="M16 10l4 8M26 11l4 7"/>',
  eye:'<path d="M4 24s8-12 20-12 20 12 20 12-8 12-20 12S4 24 4 24z"/><circle cx="24" cy="24" r="6"/>',
  note:'<path d="M18 36V10l20-4v26"/><circle cx="14" cy="36" r="5"/><circle cx="34" cy="32" r="5"/>',
  grid:'<rect x="8" y="8" width="13" height="13" rx="2"/><rect x="27" y="8" width="13" height="13" rx="2"/><rect x="8" y="27" width="13" height="13" rx="2"/><rect x="27" y="27" width="13" height="13" rx="2"/>',
  book:'<path d="M8 10c6-2 11-1 16 3 5-4 10-5 16-3v28c-6-2-11-1-16 3-5-4-10-5-16-3z"/><path d="M24 13v28"/>',
  film:'<rect x="8" y="6" width="32" height="36" rx="3"/><path d="M14 6v36M34 6v36M8 14h6M8 22h6M8 30h6M34 14h6M34 22h6M34 30h6"/>',
};
function posterText(r){
  let t = r.titulo, year = r.anio || null;
  const m = t.match(/\s*\(([^()]*?)\b((?:18|19|20)\d{2})\)\s*\.?$/);
  if (m) { year = year || m[2]; t = t.slice(0, m.index); }
  const q = t.match(/[‘'`´"“]([^'’`´"”]{2,80})[’'`´"”]/);
  let kind = null;
  for (const [re, label, icon] of KINDS) if (re.test(r.titulo) || (r.municipal && re.test(r.ciclo || ''))) { kind = {label, icon}; break; }
  if (q && /:|cine|biblioteca|quedada|filmoteca/i.test(t)) t = q[1];
  else if (kind && t.includes(':')) t = t.split(':').slice(1).join(':').trim() || t;
  return { t: t.replace(/^[\s'"`´]+|[\s'"`´.]+$/g,''), year, kind };
}
function cleanTitle(r){ return posterText(r).t || r.titulo; }
function fakePoster(r){
  const {t, year, kind} = posterText(r);
  const h = hue(r.titulo), icon = kind ? kind.icon : 'film';
  const box = el('div',{class:'fake',role:'img','aria-label':`Portada de ${r.titulo}`,
    style:`background:linear-gradient(165deg,hsl(${h} 70% 46%),hsl(${(h+40)%360} 75% 30%))`});
  box.append(el('span',{class:'fk-kind',text: kind ? kind.label : (year ? String(year) : 'Película')}));
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 48 48'); svg.setAttribute('class','fk-ico'); svg.setAttribute('aria-hidden','true');
  svg.innerHTML = ICONS[icon]; box.append(svg);
  box.append(el('span',{class:'fk-title',text:t}));
  return box;
}
function art(r){
  if (!r.cartel) return fakePoster(r);
  const i = el('img',{src:r.cartel,alt:`Cartel de ${cleanTitle(r)}`,loading:'lazy',decoding:'async'});
  i.addEventListener('error',()=>i.replaceWith(fakePoster(r)));
  return i;
}
function place(r){ return r.cine + (r.sala ? ` · ${r.sala}` : ''); }

/* Piezas */
const rowsById = new Map();
function tile(r){
  const b = el('button',{class:'tile'+(r.estado==='agotado'?' sold':''),'data-id':r.id,'aria-label':`${cleanTitle(r)}, ${r.hora||'sin hora'}, ${r.cine}`},
    art(r),
    el('span',{class:'hr',text:r.hora||'—'}),
    isFav(r.id) ? favMark() : null,
    el('span',{class:'card','aria-hidden':'true'},
      el('span',{}, el('span',{class:'k',text:'Título'}), el('span',{class:'v t',text:cleanTitle(r)})),
      el('span',{}, el('span',{class:'k',text:'Dónde'}), el('span',{class:'v',text:place(r)})),
      el('span',{}, el('span',{class:'k',text:'Cuándo'}), el('span',{class:'v',text:[r.hora, dayLabel(r.fecha)[1]].filter(Boolean).join(' · ')})),
      el('span',{}, el('span',{class:'k',text:'Precio'}), el('span',{class:'v',text:money(r) || 'Ver web'}))));
  return b;
}
const HEART_D = 'M12 20.4c-.3 0-.6-.1-.8-.3C7.9 17.5 2.6 13.4 2.6 8.9 2.6 6 4.8 3.8 7.6 3.8c1.8 0 3.4.9 4.4 2.4 1-1.5 2.6-2.4 4.4-2.4 2.8 0 5 2.2 5 5.1 0 4.5-5.3 8.6-8.6 11.2-.2.2-.5.3-.8.3z';
function heartSvg(){
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 24 24'); svg.setAttribute('aria-hidden','true'); svg.setAttribute('class','hsvg');
  const p = document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d', HEART_D); svg.append(p);
  return svg;
}
function heartBtn(r){
  const on = isFav(r.id);
  const b = el('button',{class:'heart','data-fav':r.id,'aria-pressed':String(on),'aria-label': on ? `Quitar ${cleanTitle(r)} de guardadas` : `Guardar ${cleanTitle(r)}`});
  b.append(heartSvg()); return b;
}
function favMark(){ const m = el('span',{class:'fav','aria-label':'Guardada'}); m.append(heartSvg()); return m; }
function syncFav(id){
  const on = isFav(id);
  document.querySelectorAll(`.heart[data-fav="${CSS.escape(id)}"]`).forEach(h => { h.setAttribute('aria-pressed', String(on)); });
  document.querySelectorAll(`.tile[data-id="${CSS.escape(id)}"]`).forEach(t => {
    const m = t.querySelector('.fav'); if (on && !m) t.append(favMark()); if (!on && m) m.remove();
  });
  const n = Object.keys(favs).length; $('#favN').textContent = n ? String(n) : '';
  if (document.body.dataset.layout === 'guardadas') render();
}
function groupFilms(rs){
  const groups = new Map();
  for (const r of rs) { const k = cleanTitle(r).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,' ').trim(); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
  return [...groups.values()];
}
/* Ordenador: una fila por película con todas sus sesiones */
function grow(list){
  const first = list.find(r => r.cartel) || list[0];
  const sold = list.every(r => r.estado === 'agotado');
  const n = list.length - 1;
  const ses = r => el('button',{class:'gs'+(r.estado==='agotado'?' sold':''),'data-id':r.id,'aria-label':`${cleanTitle(r)}, ${r.hora||''}, ${r.cine}`},
    el('span',{class:'h',text:r.hora || '—'}),
    el('span',{class:'c',text:r.cine + (r.sala ? ` · ${r.sala}` : '')}),
    el('span',{class:'p',text:[money(r), r.estado==='agotado' ? 'Agotado' : r.estado==='pocas' ? 'Últimas' : ''].filter(Boolean).join(' · ')}));
  const cnt = n > 0 ? el('button',{class:'gcount','aria-expanded':'false',text:`+${n} ${n===1?'sesión':'sesiones'}`}) : el('span',{class:'gcount none'});

const peek = $('#peek');

const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const w = peek.offsetWidth, h = peek.offsetHeight;
  const x = Math.min(Math.max(px - w * 0.35, 8), innerWidth - w - 8);
  const y = Math.min(Math.max(py - h * 0.5, 72), innerHeight - h - 8);
  peek.style.transform = `translate(${x}px, ${y}px)`;
  peekRaf = (Math.abs(tx - px) > 0.5 || Math.abs(ty - py) > 0.5) ? requestAnimationFrame(peekLoop) : 0;

  state.view = v; state.date = v === 'dia' ? date : null;
  if (v === 'dia' && date === iso(new Date())) { state.view = 'hoy'; state.date = null; }
  const h = hashFor(); if (location.hash !== '#'+h) history.replaceState(null,'','#'+h);
  render(); window.scrollTo({top:0});
}
function readHash(){
  const h = location.hash.slice(1);
  if (h === 'hoy' || h === 'mes') { state.view = h; state.date = null; }
  else if (h === 'semana') { state.view = 'mes'; }
  else { const m = h.match(/^dia-(\d{4}-\d{2}-\d{2})$/); if (m && m[1] >= iso(new Date())) { state.view = 'dia'; state.date = m[1]; } }
}
function openDatePop(){
  const pop = $('#datePop'), today = new Date(); today.setHours(0,0,0,0);
  const sel = state.view === 'dia' ? state.date : (state.view === 'hoy' ? iso(today) : null);
  const first = state.pickMonth || new Date(today.getFullYear(), today.getMonth(), 1);
  state.pickMonth = first;
  const count = new Map(); state.rows.forEach(r => { if (!state.from || !r.hora || r.hora >= state.from) count.set(r.fecha, (count.get(r.fecha) || 0) + 1); });
  const last = [...count.keys()].sort().pop() || iso(today);
  const q1 = el('button',{class:'dp-q','aria-pressed':String(state.view==='hoy'),text:'Hoy'}); q1.onclick = () => { setView('hoy'); closeDatePop(); };
  const q2 = el('button',{class:'dp-q','aria-pressed':String(state.view==='mes'),text:'Todo el mes'}); q2.onclick = () => { setView('mes'); closeDatePop(); };
  const hs = el('select',{id:'fromSel','aria-label':'Desde la hora'}, el('option',{value:'',text:'Cualquier hora'}),
    ['10:00','12:00','14:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00'].map(h => el('option',{value:h,text:'Desde las ' + h})));
  hs.value = state.from; hs.onchange = () => { state.from = hs.value; render(); openDatePop(); };
  const prev = el('button',{'aria-label':'Mes anterior',text:'←'}), next = el('button',{'aria-label':'Mes siguiente',text:'→'});
  prev.disabled = first <= new Date(today.getFullYear(), today.getMonth(), 1);
  next.disabled = iso(new Date(first.getFullYear(), first.getMonth()+1, 1)) > last;
  prev.onclick = () => { state.pickMonth = new Date(first.getFullYear(), first.getMonth()-1, 1); openDatePop(); };
  next.onclick = () => { state.pickMonth = new Date(first.getFullYear(), first.getMonth()+1, 1); openDatePop(); };
  const g = el('div',{class:'cgrid pick'}, ['L','M','X','J','V','S','D'].map(w => el('div',{class:'cwd',text:w})));
  const start = new Date(first); start.setDate(1 - ((first.getDay()+6)%7));
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate()+i);
    if (i >= 35 && d.getMonth() !== first.getMonth()) break;
    const f = iso(d), n = count.get(f) || 0, out = d.getMonth() !== first.getMonth();
    const cell = el('button',{class:'cday'+(d < today ? ' past':'')+(out?' out':'')+(f===sel?' sel':''),'aria-pressed':String(f===sel),
      'aria-label':`${d.getDate()} de ${MESES_L[d.getMonth()]}${n ? `, ${n} sesiones` : ', sin sesiones'}`});
    cell.append(el('span',{class:'num'+(f===iso(today)?' today':''),text:String(d.getDate())}));
    if (n && d >= today) cell.append(el('span',{class:'cnt'}, String(n), el('span',{class:'w',text:` ${n===1?'sesión':'sesiones'}`})));
    cell.disabled = d < today || !n;
    cell.onclick = () => { setView('dia', f); closeDatePop(); };
    g.append(cell);
  }
  pop.replaceChildren(
    el('div',{class:'dp-top'}, el('h2',{text:MESES_L[first.getMonth()]}),
      el('div',{class:'dp-tools'}, q1, q2, hs, el('div',{class:'calnav'}, prev, next))),
    g);
  pop.hidden = false; $('#dateBtn').setAttribute('aria-expanded','true');
}
function closeDatePop(){ $('#datePop').hidden = true; $('#dateBtn').setAttribute('aria-expanded','false'); }
$('#dateBtn').onclick = e => { e.stopPropagation(); $('#datePop').hidden ? openDatePop() : closeDatePop(); };
document.addEventListener('click', e => { if (!$('#datePop').hidden && !e.target.closest('#datePop') && !e.target.closest('#dateBtn')) closeDatePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#datePop').hidden) { closeDatePop(); $('#dateBtn').focus(); } });
document.querySelectorAll('#viewPill button').forEach(b => b.onclick = () => {
  const cur = document.body.dataset.layout;
  if (b.dataset.l === 'guardadas' && cur === 'guardadas') state.layout = state.prevLayout || 'columnas';
  else { if (cur !== 'guardadas') state.prevLayout = state.layout; state.layout = b.dataset.l; }
  savePrefs(); render(); window.scrollTo({top:0});
});
$('#l-guardadas .ico').append(heartSvg());
window.addEventListener('hashchange', () => { readHash(); render(); });
readHash();
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 200); });
setInterval(() => { if (state.loaded) renderFresh(); }, 60000);

async function load(){
  try {
    const r = await fetch('data/sesiones.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    state.rows = (d.sesiones || []).filter(x => x.titulo && x.cine);
    state.sin = d.sinopsis || {};
    for (const r of state.rows) if (favs[r.id]) favs[r.id] = Object.assign(favs[r.id], snapshot(r));
    saveFavs();
    state.meta = { ultimaActualizacion: d.actualizado, fuentes: d.fuentes };
    state.loaded = true; state.failed = false;
  } catch (e) { if (!state.loaded) state.failed = true; }
  render();
}
loadFavs();
render(); load(); setInterval(load, 10 * 60 * 1000);
setInterval(() => { const n = Object.keys(favs).length; purgeFavs(); if (Object.keys(favs).length !== n) render(); }, 60 * 1000);
</script>
