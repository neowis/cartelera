<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulso · Tus estadísticas de Spotify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141318; --bg2:#1c1b22; --bg3:#26242e; --line:#2a2830;
  --txt:#f4f3f7; --mut:#9a98a3; --acc:#7c4dff; --acc2:#a98bff; --accbg:#221d33;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Outfit',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;
  padding-top:env(safe-area-inset-top)}
/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.hdr .l,.hdr .r{display:flex;align-items:center;gap:14px;min-width:110px}
.hdr .r{justify-content:flex-end}
.ico{width:26px;height:26px;stroke:var(--mut);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ttl{text-align:center}
.ttl h1{font-size:24px;font-weight:700;letter-spacing:-.3px}
.ttl p{font-size:14px;color:var(--mut);margin-top:-2px}
.share{background:#fff;color:#111;font-weight:600;padding:8px 14px;border-radius:999px;font-size:15px}
/* tabs */
.tabs{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 8px}
.tabs .t{flex:1;padding:14px 4px 12px;font-weight:600;font-size:15px;position:relative;white-space:nowrap}
.tabs .t.on{color:var(--acc)}
.tabs .t.on::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:4px;border-radius:4px 4px 0 0;background:var(--acc)}
.tabs .sep{width:1px;height:28px;background:var(--line);margin:0 6px}
.tabs .tool{padding:10px 6px}
.tabs .tool.on .ico{stroke:var(--acc)}
/* content */
main{flex:1;overflow-y:auto;padding:6px 0 12px}
.row{display:flex;align-items:center;gap:14px;padding:9px 16px}
.rk{width:26px;text-align:center;font-weight:700;color:var(--mut);font-size:15px}
.rk.top{color:var(--txt)}
.cov{width:54px;height:54px;border-radius:6px;flex:none;object-fit:cover;background:var(--bg3);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;overflow:hidden}
.cov.rd{border-radius:50%}
.meta{min-width:0;flex:1}
.meta b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{display:block;color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.badge{font-size:12px;color:var(--acc2);background:var(--accbg);padding:3px 8px;border-radius:999px;flex:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;padding:12px 16px}
.gi .cov{width:100%;height:auto;aspect-ratio:1;font-size:28px}
.gi b{display:block;font-size:14px;font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi .n{color:var(--mut);font-weight:700;font-size:12px}
.genre{padding:10px 16px}
.genre .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.genre b{font-weight:600;font-size:16px;text-transform:capitalize}
.genre small{color:var(--mut);font-size:13px}
.bar{height:8px;border-radius:8px;background:var(--bg3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.empty{padding:120px 32px;text-align:center}
.empty h3{font-size:20px;font-weight:600;line-height:1.3}
.empty p{color:var(--mut);margin-top:10px;font-size:15px;line-height:1.45}
.btn{display:block;width:100%;padding:16px;border-radius:16px;background:var(--accbg);color:var(--acc2);font-weight:600;font-size:17px;margin-top:22px}
.btn.solid{background:var(--acc);color:#fff}
.btn.ghost{background:var(--bg3);color:var(--txt)}
/* range */
.range{display:flex;align-items:center;padding:12px 16px 10px;border-top:1px solid var(--line)}
.range .o{flex:1;font-size:19px;font-weight:600;color:var(--mut)}
.range .o.on{color:var(--acc)}
/* nav */
.nav{display:flex;border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;justify-content:center}
.nav button.on .ico{stroke:var(--acc)}
/* login */
.login{position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,#2b1f55 0%,var(--bg) 60%);
  display:flex;flex-direction:column;justify-content:center;padding:32px;z-index:5}
.logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--acc),#c084fc);
  display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.login h2{font-size:34px;font-weight:800;letter-spacing:-.5px}
.login p{color:var(--mut);font-size:16px;margin-top:8px;line-height:1.45}
.login input{width:100%;margin-top:22px;padding:15px 16px;border-radius:14px;border:1px solid var(--line);
  background:var(--bg2);color:var(--txt);font:inherit;font-size:15px}
.login small{display:block;color:var(--mut);font-size:13px;margin-top:10px;line-height:1.45}
.login code{background:var(--bg3);padding:1px 6px;border-radius:5px;font-size:12px;word-break:break-all}
.err{color:#ff7a90;font-size:14px;margin-top:12px;min-height:18px}
/* toast */
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
/* profile / home */
.card{margin:12px 16px;padding:18px;border-radius:18px;background:var(--bg2)}
.card h4{font-size:13px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.hero{display:flex;align-items:center;gap:14px}
.hero .cov{width:72px;height:72px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--bg3);border-radius:14px;padding:14px 10px;text-align:center}
.stats b{font-size:22px;display:block}
.stats span{font-size:12px;color:var(--mut)}
.spin{width:34px;height:34px;border:3px solid var(--bg3);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;margin:140px auto}
@keyframes s{to{transform:rotate(360deg)}}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:6}
.sheet.on{display:flex}
.sheet .in{background:var(--bg2);width:100%;border-radius:22px 22px 0 0;padding:10px 0 calc(20px + env(safe-area-inset-bottom))}
.sheet .in h5{font-size:16px;padding:12px 20px;color:var(--mut);font-weight:500}
.sheet .in button{display:flex;justify-content:space-between;width:100%;padding:15px 20px;font-size:17px;text-align:left}
.sheet .in button.on{color:var(--acc)}
</style>
</head>
<body>
<div class="app" id="app">

  <header class="hdr">
    <div class="l">
      <button id="bSearch" aria-label="Buscar"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button id="bQueue" aria-label="Recientes"><svg class="ico" viewBox="0 0 24 24"><path d="M3 6h12M3 11h12M3 16h7"/><circle cx="17" cy="18" r="2.5"/><path d="M19.5 18V8l2.5 1"/></svg></button>
    </div>
    <div class="ttl"><h1 id="hTitle">Top</h1><p id="hSub">últimas 4 semanas</p></div>
    <div class="r">
      <button class="share" id="bShare">Compartir</button>
      <button id="bProfile" aria-label="Perfil"><svg class="ico" viewBox="0 0 24 24" style="stroke:var(--txt)"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-5.5 8-5.5s6.5 1.5 8 5.5"/></svg></button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="t on" data-t="tracks">Canciones</button>
    <button class="t" data-t="artists">Artistas</button>
    <button class="t" data-t="albums">Álbumes</button>
    <button class="t" data-t="genres">Géneros</button>
    <span class="sep"></span>
    <button class="tool" id="bGrid" aria-label="Cuadrícula"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></button>
    <button class="tool" id="bSort" aria-label="Ordenar"><svg class="ico" viewBox="0 0 24 24"><path d="M3 6h18M3 12h12M3 18h7"/></svg></button>
  </nav>

  <main id="main"></main>

  <div class="range" id="range">
    <button class="o on" data-r="short_term">4 semanas</button>
    <button class="o" data-r="medium_term">6 meses</button>
    <button class="o" data-r="long_term">Un año</button>
    <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="8" cy="15" r=".6"/><circle cx="12" cy="15" r=".6"/><circle cx="16" cy="15" r=".6"/></svg>
  </div>

  <div class="nav" id="nav">
    <button data-v="home" aria-label="Inicio"><svg class="ico" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg></button>
    <button data-v="top" class="on" aria-label="Top"><svg class="ico" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="m3 17 6-6 4 4 8-8"/></svg></button>
    <button data-v="friends" aria-label="Amigos"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c1-4 4-5.5 7-5.5s6 1.5 7 5.5"/><path d="M16 4a4 4 0 0 1 0 8M19 15.5c1.5.8 2.5 2.5 3 5.5"/></svg></button>
    <button data-v="stats" aria-label="Estadísticas"><svg class="ico" viewBox="0 0 24 24"><path d="M5 20v-6M12 20V5M19 20v-9"/></svg></button>
  </div>

  <!-- sort sheet -->
  <div class="sheet" id="sheet"><div class="in">
    <h5>Ordenar por</h5>
    <button data-s="rank" class="on">Posición <span>✓</span></button>
    <button data-s="name">Nombre (A-Z) <span></span></button>
    <button data-s="rev">Posición inversa <span></span></button>
  </div></div>

  <!-- login -->
  <section class="login" id="login">
    <div class="logo"><svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-8 6 16 3-8h4"/></svg></div>
    <h2>Pulso</h2>
    <p>Tus canciones, artistas, álbumes y géneros más escuchados en Spotify: 4 semanas, 6 meses y un año. Todo gratis.</p>
    <input id="cid" placeholder="Client ID de tu app de Spotify" autocomplete="off" spellcheck="false">
    <small>Crea una app gratis en developer.spotify.com y añade esta URL como <b>Redirect URI</b>:<br><code id="ruri"></code></small>
    <div class="err" id="err"></div>
    <button class="btn solid" id="bLogin">Conectar con Spotify</button>
    <button class="btn ghost" id="bDemo" style="margin-top:12px">Ver con datos de ejemplo</button>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};
const REDIRECT = location.origin + location.pathname;
const SCOPES = 'user-top-read user-read-private user-read-recently-played';
const RANGE_TXT = { short_term:'últimas 4 semanas', medium_term:'últimos 6 meses', long_term:'último año' };

const S = { tab:'tracks', range:'short_term', view:'top', grid:false, sort:'rank', demo:false,
            token:null, me:null, cache:{} };

/* ---------- Spotify PKCE ---------- */
const rnd = n => { const a=new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a,b=>('0'+(b%36).toString(36)).slice(-1)).join('') };
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
  const cid = $('#cid').value.trim();
  if(!cid){ $('#err').textContent='Pega tu Client ID primero.'; return }
  store.set('pulso_cid', cid);
  const verifier = rnd(64);
  store.set('pulso_ver', verifier);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  const p = new URLSearchParams({ client_id:cid, response_type:'code', redirect_uri:REDIRECT,
    code_challenge_method:'S256', code_challenge:challenge, scope:SCOPES });
  location.href = 'https://accounts.spotify.com/authorize?' + p;
}
async function tokenReq(body){
  const r = await fetch('https://accounts.spotify.com/api/token',{method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(body)});
  if(!r.ok) throw new Error('token');
  const j = await r.json();
  store.set('pulso_tok', j.access_token);
  store.set('pulso_exp', String(Date.now() + j.expires_in*1000 - 60000));
  if(j.refresh_token) store.set('pulso_ref', j.refresh_token);
  return j.access_token;
}
async function getToken(){
  const t = store.get('pulso_tok'), exp = +store.get('pulso_exp');
  if(t && Date.now() < exp) return t;
  const ref = store.get('pulso_ref');
  if(ref) return tokenReq({grant_type:'refresh_token', refresh_token:ref, client_id:store.get('pulso_cid')});
  return null;
}
async function api(path){
  const r = await fetch('https://api.spotify.com/v1'+path,{headers:{Authorization:'Bearer '+S.token}});
  if(r.status===401){ logout(); throw new Error('401') }
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
function logout(){ ['pulso_tok','pulso_exp','pulso_ref'].forEach(store.del); S.cache={}; S.token=null; S.demo=false; $('#login').style.display='flex' }

/* ---------- data ---------- */
async function load(range){
  if(S.cache[range]) return S.cache[range];
  let d;
  if(S.demo) d = demoData(range);
  else {
    const [t,a] = await Promise.all([
      api(`/me/top/tracks?time_range=${range}&limit=50`),
      api(`/me/top/artists?time_range=${range}&limit=50`)
    ]);
    d = {
      tracks: t.items.map(x=>({ id:x.id, name:x.name, sub:x.artists.map(a=>a.name).join(', '),
        img:x.album.images?.[1]?.url||x.album.images?.[0]?.url, url:x.external_urls?.spotify,
        album:{ id:x.album.id, name:x.album.name, artist:x.album.artists.map(a=>a.name).join(', '),
                img:x.album.images?.[1]?.url||x.album.images?.[0]?.url, url:x.album.external_urls?.spotify } })),
      artists: a.items.map(x=>({ id:x.id, name:x.name, genres:x.genres||[],
        img:x.images?.[1]?.url||x.images?.[0]?.url, url:x.external_urls?.spotify }))
    };
  }
  d.albums = deriveAlbums(d.tracks);
  d.genres = deriveGenres(d.artists);
  S.cache[range] = d;
  return d;
}
// Álbumes: puntuación ponderada por la posición de cada canción en tu top
function deriveAlbums(tracks){
  const m = new Map();
  tracks.forEach((t,i)=>{
    const k = t.album.id || t.album.name;
    const e = m.get(k) || { ...t.album, score:0, count:0 };
    e.score += (tracks.length - i); e.count++;
    m.set(k,e);
  });
  return [...m.values()].sort((a,b)=>b.score-a.score)
    .map(a=>({ id:a.id, name:a.name, sub:a.artist, img:a.img, url:a.url, extra:a.count+(a.count>1?' canciones':' canción') }));
}
// Géneros: ponderados por la posición de cada artista en tu top
function deriveGenres(artists){
  const m = new Map();
  artists.forEach((a,i)=>(a.genres||[]).forEach(g=>{
    m.set(g, (m.get(g)||0) + (artists.length - i));
  }));
  const arr = [...m.entries()].sort((a,b)=>b[1]-a[1]);
  const max = arr[0]?.[1]||1, tot = arr.reduce((s,x)=>s+x[1],0)||1;
  return arr.map(([g,v])=>({ name:g, pct:Math.round(v/tot*1000)/10, w:v/max*100 }));
}

/* ---------- demo ---------- */
const DA = [
 ['Luna Vértice',['pop urbano','reggaeton','latin pop']],['Los Faros',['indie español','pop rock']],['Mara Sol',['flamenco pop','pop español']],
 ['Kiro',['trap latino','reggaeton']],['Neón Norte',['synthpop','indie español']],['Valle Hondo',['rock alternativo','indie español']],
 ['Ari Bloom',['pop','dance pop']],['Duna',['r&b alternativo','pop']],['Club Marea',['electrónica','house']],
 ['Selva Mía',['latin pop','pop urbano']],['Cobalto',['rock alternativo','post-punk']],['Iris Lane',['indie pop','bedroom pop']],
 ['Bravo Kid',['trap latino','drill español']],['Alba Real',['pop español','cantautor']],['Fénix 22',['reggaeton','pop urbano']],
 ['Ola Fría',['lo-fi','chill']],['Tango Rojo',['electro tango','electrónica']],['Nube',['bedroom pop','indie pop']],
 ['Sur & Co',['rumba','flamenco pop']],['Vera K',['dance pop','house']]
];
const DW = ['Noche','Fuego','Brillo','Calle','Mar','Cielo','Verano','Ritmo','Luz','Sombra','Eco','Viento','Latido','Marea','Neón','Sal','Oro','Humo','Rayo','Ola'];
const DW2 = ['Eterno','Lento','Azul','Salvaje','Perdido','Infinito','de Plata','Roto','Dorado','Nuevo','Sin Fin','Total','Ligero','Feroz','de Abril'];
const ALB = ['Mapas','Horizonte','Sal de Mar','Ciudad Despierta','Volver','Polaroid','Estación Norte','Voltaje','Mitad','Calma','Rojo Vivo','Telescopio'];
function seeded(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646 } }
function demoData(range){
  const r = seeded({short_term:7,medium_term:19,long_term:41}[range]);
  const artists = DA.map((a,i)=>({a,k:r()+i*0.035})).sort((x,y)=>x.k-y.k)
    .map(({a},i)=>({ id:'a'+a[0], name:a[0], genres:a[1], img:null }));
  const albums = {};
  DA.forEach((a,i)=>{ albums[a[0]] = [0,1].map(j=>({ id:'al'+i+j, name:ALB[(i*2+j)%ALB.length], artist:a[0], img:null })) });
  const tracks = [];
  for(let i=0;i<50;i++){
    const ai = Math.min(DA.length-1, Math.floor(Math.pow(r(),1.6)*DA.length));
    const art = artists[ai];
    const name = DW[Math.floor(r()*DW.length)]+' '+DW2[Math.floor(r()*DW2.length)];
    if(tracks.some(t=>t.name===name)){ i--; continue }
    tracks.push({ id:'t'+i, name, sub:art.name, img:null, album:albums[art.name][r()<.6?0:1] });
  }
  return { tracks, artists };
}

/* ---------- render ---------- */
function hue(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))%360; return h }
function cover(item, round){
  if(item.img) return `<img class="cov${round?' rd':''}" src="${item.img}" alt="" loading="lazy">`;
  const h = hue(item.name);
  return `<div class="cov${round?' rd':''}" style="background:linear-gradient(135deg,hsl(${h} 70% 45%),hsl(${(h+50)%360} 70% 28%))">${esc(item.name[0])}</div>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
function sorted(list){
  const l = list.map((x,i)=>({...x, rank:i+1}));
  if(S.sort==='name') l.sort((a,b)=>a.name.localeCompare(b.name,'es'));
  if(S.sort==='rev') l.reverse();
  return l;
}
function linkWrap(item, html){ return item.url ? `<a href="${item.url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${html}</a>` : html }

async function render(){
  const main = $('#main');
  $('#hSub').textContent = RANGE_TXT[S.range];
  if(S.view==='home') return renderHome();
  if(S.view==='friends') return renderFriends();
  if(S.view==='stats') return renderStats();
  main.innerHTML = '<div class="spin"></div>';
  let d;
  try{ d = await load(S.range) }catch(e){ main.innerHTML = errBox(e); return }
  const list = sorted(d[S.tab]);
  if(S.tab==='genres'){
    if(!list.length){ main.innerHTML = `<div class="empty"><h3>Spotify no ha devuelto géneros</h3><p>Algunas apps en modo desarrollo de Spotify ya no reciben los géneros de los artistas. Las demás pestañas siguen funcionando.</p></div>`; return }
    main.innerHTML = list.slice(0,40).map(g=>`
      <div class="genre"><div class="top"><b>${g.rank}. ${esc(g.name)}</b><small>${g.pct}%</small></div>
      <div class="bar"><i style="width:${g.w}%"></i></div></div>`).join('');
    return;
  }
  const round = S.tab==='artists';
  if(S.grid){
    main.innerHTML = `<div class="grid">${list.map(x=>linkWrap(x,`
      <div class="gi">${cover(x,round)}<b><span class="n">${x.rank}</span> ${esc(x.name)}</b>${x.sub?`<span>${esc(x.sub)}</span>`:''}</div>`)).join('')}</div>`;
  } else {
    main.innerHTML = list.map(x=>linkWrap(x,`
      <div class="row"><div class="rk ${x.rank<=3?'top':''}">${x.rank}</div>${cover(x,round)}
      <div class="meta"><b>${esc(x.name)}</b>${x.sub?`<span>${esc(x.sub)}</span>`:(x.genres?.length?`<span>${esc(x.genres.slice(0,2).join(' · '))}</span>`:'')}</div>
      ${x.extra?`<span class="badge">${x.extra}</span>`:''}</div>`)).join('');
  }
}
function errBox(e){ return `<div class="empty"><h3>No se pudieron cargar tus datos</h3><p>${e.message==='403'?'Tu cuenta tiene que estar añadida como usuario en la app de Spotify (User Management) y el dueño de la app necesita Premium.':'Revisa tu conexión e inténtalo otra vez.'}</p><button class="btn" onclick="location.reload()">Reintentar</button></div>` }

async function renderHome(){
  const main=$('#main'); main.innerHTML='<div class="spin"></div>';
  let d; try{ d=await load(S.range) }catch(e){ main.innerHTML=errBox(e); return }
  const name = S.demo ? 'Modo ejemplo' : (S.me?.display_name||'Tú');
  const t=d.tracks[0], a=d.artists[0], al=d.albums[0], g=d.genres[0];
  main.innerHTML = `
    <div class="card"><div class="hero">${cover({name, img:S.me?.images?.[0]?.url},true)}
      <div class="meta"><b style="font-size:22px">${esc(name)}</b><span>${RANGE_TXT[S.range]}</span></div></div></div>
    <div class="card"><h4>Resumen</h4><div class="stats">
      <div><b>${d.tracks.length}</b><span>canciones</span></div>
      <div><b>${d.artists.length}</b><span>artistas</span></div>
      <div><b>${d.genres.length}</b><span>géneros</span></div></div></div>
    ${t?`<div class="card"><h4>Tu canción nº1</h4><div class="hero">${cover(t)}<div class="meta"><b>${esc(t.name)}</b><span>${esc(t.sub)}</span></div></div></div>`:''}
    ${a?`<div class="card"><h4>Tu artista nº1</h4><div class="hero">${cover(a,true)}<div class="meta"><b>${esc(a.name)}</b><span>${esc((a.genres||[]).slice(0,2).join(' · '))}</span></div></div></div>`:''}
    ${al?`<div class="card"><h4>Tu álbum nº1</h4><div class="hero">${cover(al)}<div class="meta"><b>${esc(al.name)}</b><span>${esc(al.sub)}</span></div></div></div>`:''}
    ${g?`<div class="card"><h4>Tu género nº1</h4><b style="font-size:22px;text-transform:capitalize">${esc(g.name)}</b></div>`:''}
    <div style="padding:0 16px"><button class="btn ghost" id="bOut">${S.demo?'Salir del modo ejemplo':'Cerrar sesión'}</button></div>`;
  $('#bOut').onclick = logout;
}
function renderFriends(){
  $('#main').innerHTML = `<div class="empty"><h3>Amigos</h3><p>Comparte tu top con el botón <b>Compartir</b> y compáralo con el de tus amigos.</p></div>`;
}
async function renderStats(){
  const main=$('#main'); main.innerHTML='<div class="spin"></div>';
  let d; try{ d=await load(S.range) }catch(e){ main.innerHTML=errBox(e); return }
  const counts = {}; d.tracks.forEach(t=>t.sub.split(', ').forEach(n=>counts[n]=(counts[n]||0)+1));
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8), max = top[0]?.[1]||1;
  main.innerHTML = `<div class="card"><h4>Artistas con más canciones en tu top 50</h4>
    ${top.map(([n,c])=>`<div class="genre" style="padding:8px 0"><div class="top"><b style="text-transform:none">${esc(n)}</b><small>${c}</small></div><div class="bar"><i style="width:${c/max*100}%"></i></div></div>`).join('')}</div>
    <div class="card"><h4>Top 5 géneros</h4>${d.genres.slice(0,5).map((g,i)=>`<div class="genre" style="padding:8px 0"><div class="top"><b>${i+1}. ${esc(g.name)}</b><small>${g.pct}%</small></div><div class="bar"><i style="width:${g.w}%"></i></div></div>`).join('')||'<p style="color:var(--mut)">Sin datos de géneros.</p>'}</div>`;
}

/* ---------- UI ---------- */
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800) }
function setView(v){
  S.view=v;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const isTop = v==='top';
  $('#tabs').style.display = isTop?'flex':'none';
  $('#hTitle').textContent = {home:'Inicio',top:'Top',friends:'Amigos',stats:'Estadísticas'}[v];
  render();
}
document.querySelectorAll('#tabs .t').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs .t').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.tab=b.dataset.t; $('#main').scrollTop=0; render();
});
document.querySelectorAll('#range .o').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#range .o').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  S.range=b.dataset.r; $('#main').scrollTop=0; render();
});
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('#bGrid').onclick=()=>{ S.grid=!S.grid; $('#bGrid').classList.toggle('on',S.grid); render() };
$('#bSort').onclick=()=>$('#sheet').classList.add('on');
$('#sheet').onclick=e=>{
  const b=e.target.closest('button');
  if(b){ S.sort=b.dataset.s; document.querySelectorAll('#sheet button').forEach(x=>{x.classList.toggle('on',x===b); x.lastElementChild.textContent=x===b?'✓':''}); render() }
  $('#sheet').classList.remove('on');
};
$('#bProfile').onclick=()=>setView('home');
$('#bSearch').onclick=()=>toast('Desliza la lista para ver tu top 50');
$('#bQueue').onclick=async()=>{
  if(S.demo){ toast('Disponible al conectar Spotify'); return }
  try{ const r=await api('/me/player/recently-played?limit=20');
    $('#hTitle').textContent='Recientes'; $('#tabs').style.display='none';
    $('#main').innerHTML=r.items.map((x,i)=>`<div class="row"><div class="rk">${i+1}</div>${cover({name:x.track.name,img:x.track.album.images?.[2]?.url||x.track.album.images?.[0]?.url})}<div class="meta"><b>${esc(x.track.name)}</b><span>${esc(x.track.artists.map(a=>a.name).join(', '))} · ${new Date(x.played_at).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</span></div></div>`).join('');
  }catch(e){ toast('No se pudo cargar') }
};
$('#bShare').onclick=async()=>{
  const d=S.cache[S.range]; if(!d) return;
  const lab={tracks:'canciones',artists:'artistas',albums:'álbumes',genres:'géneros'}[S.tab];
  const txt=`Mi top ${lab} · ${RANGE_TXT[S.range]}\n`+d[S.tab].slice(0,10).map((x,i)=>`${i+1}. ${x.name}${x.sub?' — '+x.sub:''}`).join('\n');
  try{ await navigator.clipboard.writeText(txt); toast('Top copiado al portapapeles') }catch(e){ toast('No se pudo copiar') }
};
$('#bLogin').onclick=login;
$('#bDemo').onclick=()=>{ S.demo=true; S.cache={}; $('#login').style.display='none'; setView('top') };

/* ---------- start ---------- */
(async function init(){
  $('#ruri').textContent = REDIRECT;
  $('#cid').value = store.get('pulso_cid')||'';
  // Si la página está en un sitio que bloquea conexiones externas (p. ej. dentro de claude.ai), avisa
  fetch('https://api.spotify.com/v1/').catch(()=>{
    $('#bLogin').disabled = true; $('#bLogin').style.opacity = .4;
    $('#err').textContent = 'Aquí solo funciona el modo ejemplo. Para conectar Spotify, abre la app desde tu propia URL (GitHub Pages).';
  });
  const q = new URLSearchParams(location.search);
  try{
    if(q.get('code')){
      history.replaceState(null,'',REDIRECT);
      S.token = await tokenReq({ grant_type:'authorization_code', code:q.get('code'), redirect_uri:REDIRECT,
        client_id:store.get('pulso_cid'), code_verifier:store.get('pulso_ver') });
    } else if(q.get('error')){
      history.replaceState(null,'',REDIRECT); $('#err').textContent='Spotify canceló el inicio de sesión.';
    } else S.token = await getToken();
  }catch(e){ $('#err').textContent='No se pudo iniciar sesión. Revisa el Client ID y la Redirect URI.' }
  if(S.token){
    $('#login').style.display='none';
    try{ S.me = await api('/me') }catch(e){}
    setView('top');
  }
})();
})();
</script>
</body>
</html>
